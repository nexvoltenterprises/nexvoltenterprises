<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="nexvoltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F2D675" />
      <stop offset="50%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#B8932C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="48" height="48" rx="12" fill="#0B0B0D" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Centered Nexvolt Lightning Bolt -->
  <polygon
    points="26,6 13,26 21,26 17,42 34,19 25,19"
    fill="url(#nexvoltGold)"
    filter="url(#glow)"
  />
</svg>
